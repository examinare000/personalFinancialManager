# shared/pyproject.toml — kakeibo Python 依存マニフェスト（ADR-015）
#
# 役割:
# - api / worker 両 Python コンテナが共通参照する依存マニフェスト
# - shared 自体は Python パッケージではなく素のモジュール群（ADR-014 Q1=案B）。
#   ``[tool.uv].package = false`` で「仮想プロジェクト」と宣言し、
#   uv は依存の解決・ロックだけに使い、shared をビルド/インストールしない。
# - サービス専有依存は extras（``api`` / ``worker``）で分離し、
#   各コンテナの Dockerfile が ``uv sync --extra <該当>`` で必要な部分集合のみ導入する。
#
# 参照:
# - docs/adr/015-container-local-python-toolchain.md（本ファイルの根拠）
# - docs/adr/014-per-service-source-layout.md（サービス境界）
# - docs/plans/01-development-plan.md §8.1 ツール要件

[project]
name = "kakeibo"
version = "0.1.0"
description = "個人向け資産・家計管理アプリケーション 共通依存マニフェスト（ADR-015）"
license = { text = "Proprietary" }
requires-python = ">=3.12"
authors = [
    { name = "Ryosuke Ikeda" },
]

# 全 Python コンテナが必要とする最小コア依存。
# pydantic / structlog / sqlalchemy は shared/kakeibo_shared/ が直接利用する。
# psycopg / click / httpx は worker / api 双方の取込・呼出経路で共通的に使う。
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "structlog>=24.1,<25",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "click>=8.1,<9",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
# Flask は api コンテナのみ必要（worker は HTTP サーバを持たない）。
api = [
    "flask>=3.0,<4",
]

# Alembic は worker コンテナが migration 実行主体（postgres/src/alembic を mount）。
# api コンテナは alembic を実行しないため worker extras に置く。
worker = [
    "alembic>=1.13,<2",
]

# Phase 2.x のメール取込で導入する追加依存（worker のみ）。
mail = [
    "mail-parser>=1.0,<2",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.2,<6",
]

# Phase 1.x（ひふみ投信 PDF）／4.x で導入する PDF パース依存（worker のみ）。
pdf = [
    "pypdf>=4.2,<5",
]

# Phase 4.1 LLM 分類サービスで導入する依存（worker のみ）。
llm = [
    "anthropic>=0.30,<1",
]

# 開発・テスト・品質ゲート用の依存。worker コンテナにのみ導入し、
# `docker compose run --rm worker pytest ...` で全テスト・lint・typecheck を実行する。
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<6",
    "hypothesis>=6.100,<7",
    "testcontainers>=4.5,<5",
    "ruff>=0.5,<1",
    "pyright>=1.1.360,<2",
]

# ──────────────────────────────────────────────────────────────────
# uv 設定: shared 自体は Python パッケージではないため非ビルド宣言する
# ──────────────────────────────────────────────────────────────────
[tool.uv]
# shared をビルド可能パッケージとして扱わない（=「仮想プロジェクト」）。
# uv lock / sync は依存の解決・インストールだけに使い、
# shared/kakeibo_shared/ 自体は Dockerfile の COPY と PYTHONPATH 注入で配信する。
package = false

# ──────────────────────────────────────────────────────────────────
# pytest 設定（worker コンテナ内で `pytest` を呼んだ時の規約）
# ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
# CWD = /app/shared を想定。worker コンテナでは
# - /app/tests          （横断構造テスト、ホスト ./tests を mount）
# - /app/worker/tests   （worker / kakeibo_shared / alembic 関連テスト）
# - /app/api/tests      （api Flask テスト、ruff/typecheck 用に mount される）
# が同時にマウントされており、すべてを一括収集対象とする。
testpaths = [
    "../tests",
    "../worker/tests",
    "../api/tests",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:sqlalchemy.*",
    "ignore::DeprecationWarning:alembic.*",
]

# ──────────────────────────────────────────────────────────────────
# ruff 設定（lint + format 兼用）
# ──────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
# CWD = /app/shared を想定し、各サービスの src と shared 自身、
# 横断テストとサービス専有テストをすべて検査対象とする。
src = [
    ".",
    "../api/src",
    "../worker/src",
    "../tests",
    "../api/tests",
    "../worker/tests",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "T20",  # flake8-print（print の混入禁止）
    "SIM",  # flake8-simplify
    "RUF",  # Ruff 固有
]
ignore = [
    # 日本語コメント・docstring 内の全角括弧・カタカナ記号は意図的な使用のため許容する。
    "RUF001",  # 文字列内の ambiguous 文字
    "RUF002",  # docstring 内の ambiguous 文字
    "RUF003",  # コメント内の ambiguous 文字
]

[tool.ruff.lint.per-file-ignores]
# テストでは日本語関数名を採用するため pep8-naming を緩める。
"../tests/**" = ["N802", "N803", "N806", "RUF001", "RUF002", "RUF003"]
"../worker/tests/**" = ["N802", "N803", "N806", "RUF001", "RUF002", "RUF003"]
"../api/tests/**" = ["N802", "N803", "N806", "RUF001", "RUF002", "RUF003"]
# alembic は自動生成ファイルが多くスタイル統一を強制しない。
"../postgres/src/alembic/versions/*.py" = ["E501", "N999"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ──────────────────────────────────────────────────────────────────
# pyright 設定（strict）
# ──────────────────────────────────────────────────────────────────
[tool.pyright]
include = [
    ".",
    "../api/src",
    "../worker/src",
    "../tests",
    "../api/tests",
    "../worker/tests",
    "../postgres/src/alembic",
]
# CWD = /workspace/shared を起点として、リポジトリルート（=/workspace）と
# 各サービスの src ルートを import 解決パスに加える。
# - リポジトリルート: ``tests`` パッケージを top-level として import 可能にする
# - 各 src: ``kakeibo_api`` / ``kakeibo_worker`` / ``kakeibo_shared`` を解決
extraPaths = [
    "..",
    ".",
    "../api/src",
    "../worker/src",
]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "../postgres/src/alembic/versions",  # 自動生成は strict 対象外
]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"
reportImplicitOverride = "none"

# ──────────────────────────────────────────────────────────────────
# coverage（pytest-cov）設定
# ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
branch = true
# ADR-014 のサービス境界別パッケージをすべてカバレッジ対象とする。
source = ["kakeibo_shared", "kakeibo_api", "kakeibo_worker"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
