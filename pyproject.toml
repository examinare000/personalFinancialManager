# pyproject.toml — kakeibo プロジェクトの正本マニフェスト
#
# 方針:
# - 依存パッケージは [project.dependencies] にマイナーレンジで宣言する
# - 開発依存は [project.optional-dependencies].dev に集約する
# - Phase で必要になる重い依存は extras（pdf / mail / llm）で分離する
# - 厳密な版固定は uv.lock で行う（requirements.txt は採用しない）
# - ビルドバックエンドは hatchling（src レイアウト）
#
# 参照:
# - docs/plans/01-development-plan.md §8.1 ツール要件
# - agent-rules/00-core-principles.md（TDD・日本語）
# - agent-rules/12-security-guidelines.md（シークレット運用）

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kakeibo"
version = "0.1.0"
description = "個人向け資産・家計管理アプリケーション（NAS + Docker Compose 構成）"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.12"
authors = [
    { name = "Ryosuke Ikeda" },
]
keywords = ["finance", "kakeibo", "personal", "self-hosted"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "License :: Other/Proprietary License",
    "Private :: Do Not Upload",
]

# Phase 1〜2 のコア依存。バージョンはマイナーレンジで広めに取り、
# uv.lock で固定する。
dependencies = [
    "flask>=3.0,<4",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "alembic>=1.13,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "click>=8.1,<9",
    "httpx>=0.27,<1",
    "structlog>=24.1,<25",
]

[project.optional-dependencies]
# 開発・テスト・品質ゲート用の依存。
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<6",
    "hypothesis>=6.100,<7",
    "testcontainers>=4.5,<5",
    "ruff>=0.5,<1",
    "pyright>=1.1.360,<2",
]

# Phase 2.x のメール取込で導入する追加依存。
mail = [
    "mail-parser>=1.0,<2",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.2,<6",
]

# Phase 1.x（拡張）／4.x で導入する PDF パース依存。
pdf = [
    "pypdf>=4.2,<5",
]

# Phase 4.1 LLM 分類サービスで導入する依存。
llm = [
    "anthropic>=0.30,<1",
]

[project.scripts]
# Phase 1.6 で取込 CLI を提供する想定のエントリポイント。
# 実体は後続コミットで src/kakeibo/__main__.py か CLI モジュールへ接続する。
kakeibo = "kakeibo.__main__:main"

[project.urls]
Homepage = "https://github.com/examinare000/personalFinancialManager"
Repository = "https://github.com/examinare000/personalFinancialManager"

# ──────────────────────────────────────────────────────────────────
# hatchling 設定: src レイアウトを明示する
# ──────────────────────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["src/kakeibo"]

# ──────────────────────────────────────────────────────────────────
# pytest 設定
# ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error",
    # SQLAlchemy / alembic 等が出す DeprecationWarning は将来対応する余地を残す。
    "ignore::DeprecationWarning:sqlalchemy.*",
    "ignore::DeprecationWarning:alembic.*",
]

# ──────────────────────────────────────────────────────────────────
# ruff 設定（lint + format 兼用）
# ──────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# agressive な選択。後続フェーズで違反が頻発するルールは個別に
# noqa 指定または per-file-ignores で例外管理する。
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "T20",  # flake8-print（print の混入禁止）
    "SIM",  # flake8-simplify
    "RUF",  # Ruff 固有
]
ignore = [
    # 日本語コメント・docstring 内の全角括弧・カタカナ記号は意図的な使用のため許容する。
    # agent-rules/00-core-principles.md の「日本語使用」原則と整合させるため、
    # ambiguous 文字検出ルールはプロジェクト全体で無効化する。
    "RUF001",  # 文字列内の ambiguous 文字
    "RUF002",  # docstring 内の ambiguous 文字
    "RUF003",  # コメント内の ambiguous 文字
]

[tool.ruff.lint.per-file-ignores]
# テストでは日本語関数名を採用するため pep8-naming を緩める。
# また、機微な値の検証で `ANN` 系が冗長になるためテストコードは型注釈緩和。
"tests/**" = ["N802", "N803", "N806", "RUF001", "RUF002", "RUF003"]
# alembic は自動生成ファイルが多くスタイル統一を強制しない。
"postgres/src/alembic/versions/*.py" = ["E501", "N999"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ──────────────────────────────────────────────────────────────────
# pyright 設定（strict）
# ──────────────────────────────────────────────────────────────────
[tool.pyright]
include = ["src", "tests", "postgres/src/alembic"]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "postgres/src/alembic/versions",  # 自動生成は strict 対象外
]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"
# テスト関数の戻り値 None は明示しないでよい慣習に合わせる。
reportImplicitOverride = "none"

# ──────────────────────────────────────────────────────────────────
# coverage（pytest-cov）設定
# ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
branch = true
source = ["kakeibo"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
