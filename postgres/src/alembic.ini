# Alembic 設定ファイル。
#
# sqlalchemy.url は ${DATABASE_URL} を参照する placeholder のみ記述し、
# 実際の解決は alembic/env.py の resolve_database_url() で行う。
# これにより:
# - シークレットを ini に書かない（agent-rules/12-security-guidelines.md）
# - Docker secret 経由でパスワードを供給する設計と整合（design/05-security-model.md）
# - テストで env.py を直接 import して URL 解決ロジックを検証できる

[alembic]
# script_location は ``%(here)s`` (alembic.ini 自身のディレクトリ) を起点に
# 解決する。CWD 相対 (``alembic``) だと WORKDIR=/app の本番手順
# ``alembic -c /app/postgres/src/alembic.ini upgrade head`` で
# /app/alembic を探してしまい ``Path doesn't exist: alembic.`` で失敗する。
# 絶対パス化により、どの CWD で呼ばれても /app/postgres/src/alembic を解決できる。
script_location = %(here)s/alembic
prepend_sys_path = .
# alembic 1.13+ で path_separator が必須化された (未指定で DeprecationWarning)。
# ``os`` は OS 依存のセパレータ (POSIX=":", Windows=";") を使う既定値。
# version_path_separator (versions ディレクトリ内のリビジョン分離) とは別概念。
path_separator = os
version_path_separator = os
sqlalchemy.url = ${DATABASE_URL}

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
