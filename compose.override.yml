# 開発環境 override。`docker compose up` 時に自動でマージされる。
#
# 開発上の差分:
# - Postgres を localhost:5432 に公開（DB GUI から直接接続するため）
# - api を 127.0.0.1:8000 に公開（curl / Postman で疎通確認）
# - ui を 127.0.0.1:3000 に公開（ブラウザで直接ダッシュボードを確認）
# - worker は profiles で隔離可能にし、開発時にバッチ常駐を抑制
# - Caddy は本番でしか起動しないので profiles=prod 専用にして開発からは外す
#
# ADR-015 によりホストには uv / Python を置かず、テスト・lint・typecheck
# はすべてコンテナ内で行う。リポジトリ全体を ``./:/workspace`` でマウントし、
# ``PYTHONPATH`` と ``working_dir`` を /workspace 配下に切り替えることで、
# ホスト編集が即時反映される hot reload と、コンテナ内でのテスト走行
# （`docker compose run --rm worker pytest`）の両方を成立させる。

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  api:
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # 開発時のみ DEBUG ログを有効化する
      LOG_LEVEL: DEBUG
      # /workspace（ホスト ./ をマウント）配下の shared / api/src を Python
      # 解決パスに切り替える。本番（override 不適用）では Dockerfile の
      # PYTHONPATH=/app/shared:/app/api/src のままで動く。
      PYTHONPATH: /workspace/shared:/workspace/api/src
    volumes:
      # リポジトリ全体を /workspace へマウントし、ソース変更を即時反映する。
      # /app の image-baked コードは PYTHONPATH 上書きで使われなくなるが、
      # 削除はしない（override 不適用時に本番通り動かすため）。
      - .:/workspace
    working_dir: /workspace

  worker:
    # 開発では既定で worker を起動しない。明示的に
    # `docker compose --profile worker up worker` で起動する。
    # テストは profiles に関係なく `docker compose run --rm worker pytest` で実行可能。
    profiles: ["worker"]
    # ADR-015 §テストの所在: docker CLI を使う compose 構文検証テストを
    # コンテナ内で動かすため、host の docker daemon socket を bind mount し、
    # root ユーザで起動する（kakeibo ユーザでは socket への gid 一致が
    # ホスト OS によって変わり再現性が落ちるため、開発時のみ root 化）。
    user: root
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # worker は dev extras を持つテスト基盤も兼ねるため、api 側のソースも
      # PYTHONPATH に含める（api の Flask アプリテストを worker で実行するため）。
      PYTHONPATH: /workspace/shared:/workspace/worker/src:/workspace/api/src
    # pytest は shared/pyproject.toml を起点に testpaths（../tests, ../worker/tests,
    # ../api/tests）を解決するため、CWD を /workspace/shared に固定する。
    working_dir: /workspace/shared

  ui:
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    profiles: ["prod"]

  backup:
    profiles: ["prod"]
