# 開発環境 override。`docker compose up` 時に自動でマージされる。
#
# 開発上の差分:
# - Postgres を localhost:5432 に公開（DB GUI から直接接続するため）
# - api を 127.0.0.1:8000 に公開（curl / Postman で疎通確認）
# - ui を 127.0.0.1:3000 に公開（ブラウザで直接ダッシュボードを確認）
# - worker は profiles で隔離可能にし、開発時にバッチ常駐を抑制
# - Caddy は本番でしか起動しないので profiles=prod 専用にして開発からは外す

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  api:
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # 開発時のみ DEBUG ログを有効化する
      LOG_LEVEL: DEBUG
    # DoD5: ホスト側の編集が即時にコンテナへ反映されるよう、
    # editable install 済み（uv sync）のソースツリーを bind mount する。
    # ADR-014 によりサービス専有コードは ``api/src`` 配下、共有コードは
    # ``shared`` 配下に分離されたため両者をマウントする。
    # api/Dockerfile の COPY 先（/app/src, /app/shared）と一致させる。
    volumes:
      - ./api/src:/app/src
      - ./shared:/app/shared

  worker:
    # 開発では既定で worker を起動しない。明示的に
    # `docker compose --profile worker up worker` で起動する。
    profiles: ["worker"]
    # DoD5: api と同じ理由でソースツリーを bind mount する。
    # worker/Dockerfile の COPY 先（/app/src, /app/shared）と一致させる。
    volumes:
      - ./worker/src:/app/src
      - ./shared:/app/shared

  ui:
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    profiles: ["prod"]

  backup:
    profiles: ["prod"]
