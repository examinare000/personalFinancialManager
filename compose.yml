# 個人向け資産・家計管理アプリケーション 本番（NAS）構成。
#
# 設計準拠: docs/design/04-deployment-stack.md §2 / agent-rules/70-docker-environments.md
# 設計指針:
# - secret は Docker secret 経由で *_FILE 規約に沿って供給する
# - DB は internal: true ネットワークに閉じ込め、外部到達不可にする
# - api / ui / caddy のみ external ネットワーク（Caddy 経由のみ inbound 許可）
# - build context はリポジトリルート、dockerfile は <component>/Dockerfile を指定する
# - 各サービスに healthcheck を定義し `docker compose up -d` 後に
#   `docker compose ps` で healthy が確認できる状態にする

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kakeibo
      POSTGRES_USER: kakeibo
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      TZ: Asia/Tokyo
    volumes:
      - ./data/pg:/var/lib/postgresql/data
      - ./backup:/backup
    secrets:
      - pg_password
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kakeibo"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kakeibo@postgres:5432/kakeibo
      PG_PASSWORD_FILE: /run/secrets/pg_password
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_key
      TZ: Asia/Tokyo
    secrets:
      - pg_password
      - anthropic_key
    networks: [internal, external]
    restart: unless-stopped
    healthcheck:
      # python:3.12-slim には curl/wget が無いため、urllib で /health を叩く。
      # 200 以外で例外、urlopen 失敗で SystemExit にして失敗扱いにする。
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/health',timeout=3); sys.exit(0 if r.status==200 else 1)\" || exit 1"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./inbox:/inbox:rw
      - ./archive:/archive:rw
      - ./dead_letter:/dead_letter:rw
    environment:
      DATABASE_URL: postgresql://kakeibo@postgres:5432/kakeibo
      PG_PASSWORD_FILE: /run/secrets/pg_password
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_key
      PAYPAL_API_SECRET_FILE: /run/secrets/paypal_api_secret
      GMAIL_OAUTH_TOKEN_FILE: /run/secrets/gmail_oauth_token
      INBOX_PATH: /inbox
      ARCHIVE_PATH: /archive
      DEAD_LETTER_PATH: /dead_letter
      WORKER_HEARTBEAT_PATH: /tmp/worker_heartbeat
      TZ: Asia/Tokyo
    secrets:
      - pg_password
      - anthropic_key
      - paypal_api_secret
      - gmail_oauth_token
    networks: [internal, external]
    restart: unless-stopped
    healthcheck:
      # heartbeat ファイルが 120 秒以内に更新されていることを確認する。
      # Python の os.path.getmtime を使えば busybox / GNU stat の差異を吸収できる。
      test:
        - "CMD-SHELL"
        - "python -c \"import os,sys,time; p=os.environ.get('WORKER_HEARTBEAT_PATH','/tmp/worker_heartbeat'); sys.exit(0 if os.path.exists(p) and (time.time()-os.path.getmtime(p))<120 else 1)\""
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    depends_on:
      - api
    networks: [external]
    restart: unless-stopped
    healthcheck:
      # node:20-alpine には wget / curl が同梱されないため、Node 内蔵 http で
      # / を叩いて 200 のみ healthy 判定する（ui/Dockerfile の HEALTHCHECK と
      # 同じプローブ。api/Dockerfile の urllib プローブと同じ思想）。
      test:
        - "CMD-SHELL"
        - "node -e \"require('http').get('http://localhost:3000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\" || exit 1"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    networks: [external]
    ports:
      - "127.0.0.1:8443:443"
    depends_on:
      - api
      - ui
    restart: unless-stopped
    healthcheck:
      # caddy の admin endpoint（localhost:2019）が応答することを確認する。
      # 443 の HTTPS は SNI と self-signed 証明書のホスト名検証が
      # busybox wget では通らないため、admin API を疎通プローブに採用する。
      test:
        - "CMD-SHELL"
        - "wget --quiet --tries=1 -O - http://127.0.0.1:2019/config/ >/dev/null || exit 1"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  backup:
    image: postgres:16-alpine
    volumes:
      - ./backup:/backup
    command: >
      sh -c "while true; do
        PGPASSWORD=$$(cat /run/secrets/pg_password) \
          pg_dump -h postgres -U kakeibo kakeibo | gzip > /backup/$$(date +%Y%m%d).sql.gz;
        find /backup -name '*.sql.gz' -mtime +30 -delete;
        sleep 86400;
      done"
    secrets:
      - pg_password
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      # sleep ループの常駐を確認する軽量な判定。pg_dump 実行中は busy だが、
      # 通常は sleep プロセスが見えるはず。pgrep は postgres:16-alpine に同梱されない
      # ことがあるので、ps と grep の組み合わせで代替する。
      test: ["CMD-SHELL", "ps -A -o comm | grep -E '^(sh|sleep|pg_dump)$' || exit 1"]
      interval: 60s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  # internal は外部到達不可。Postgres・worker のような DB 直結サービスを収容する。
  internal:
    internal: true
  # external は外向き通信を許可。Caddy / api / worker（egress 用）/ ui を収容する。
  external:

secrets:
  pg_password:
    file: ./secrets/pg_password.txt
  anthropic_key:
    file: ./secrets/anthropic_key.txt
  gmail_oauth_token:
    file: ./secrets/gmail_oauth_token.json
  paypal_api_secret:
    file: ./secrets/paypal_api_secret.txt
