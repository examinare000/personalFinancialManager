# ui コンテナの nginx 設定（Phase 0 スタブ）。
#
# 設計指針:
# - Caddy が ui:3000 に reverse_proxy するため、3000 番で listen する。
# - SPA 化（Phase 3）した際は try_files による history fallback を追加する。
# - gzip / cache-control の細かい制御は Phase 3 のフロントエンド作業で
#   フロント自身のビルド成果物に合わせて調整する。

server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Phase 0 では単一 HTML を返すだけ。404 も同 HTML を返してよいが、
    # 明示的に index.html を try する書き方にしておくと将来の SPA 対応が
    # diff 1 行で済む。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
